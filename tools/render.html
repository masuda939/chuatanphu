<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}#c{width:640px;height:840px;display:block}</style></head>
<body><canvas id="c"></canvas>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setSize(640,840);renderer.setClearColor(0x000000,0);
renderer.outputColorSpace=THREE.SRGBColorSpace;
const scene=new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff,.85));
const key=new THREE.DirectionalLight(0xfff2d0,1.5);key.position.set(2.5,4,5);scene.add(key);
const fill=new THREE.DirectionalLight(0xbfd4ff,.5);fill.position.set(-3,1.5,-2);scene.add(fill);
const rim=new THREE.DirectionalLight(0xffd9a0,.8);rim.position.set(0,2,-4);scene.add(rim);
new GLTFLoader().load('/buddha-cc0.glb',(g)=>{
  const model=g.scene;
  const gold=new THREE.MeshStandardMaterial({color:0xd8ae5d,metalness:.82,roughness:.34});
  const skin=new THREE.MeshStandardMaterial({color:0xe4c078,metalness:.6,roughness:.42});
  let first=0;
  model.traverse((o)=>{ if(o.isMesh){ o.material=first++===0?gold:gold; o.castShadow=false; } });
  scene.add(model);
  const box=new THREE.Box3().setFromObject(model);
  const size=box.getSize(new THREE.Vector3());const center=box.getCenter(new THREE.Vector3());
  model.position.sub(center);
  const maxDim=Math.max(size.x,size.y,size.z);
  const cam=new THREE.PerspectiveCamera(30,640/840,.01,100);
  const fitDist=(maxDim/2)/Math.tan(THREE.MathUtils.degToRad(15))*1.3;
  cam.position.set(0,0,fitDist);
  cam.lookAt(0,-size.y*0.02,0);
  renderer.render(scene,cam);
  window.__ready=true;
},undefined,(e)=>{console.error('load error',e);});
window.__ping=()=>window.__ready===true;
</script></body></html>
